apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitflow-orchestrator
  namespace: pitflow
  labels:
    app.kubernetes.io/name: pitflow-orchestrator
    app.kubernetes.io/part-of: pitflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pitflow-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pitflow-orchestrator
        app.kubernetes.io/part-of: pitflow
        tags.datadoghq.com/env: "producao"
        tags.datadoghq.com/service: "pitflow-orchestrator"
        tags.datadoghq.com/version: "${IMAGE_VERSION}"
      annotations:
        admission.datadoghq.com/java-lib.version: "latest"
    spec:
      containers:
        - name: pitflow-orchestrator
          image: "${CONTAINER_IMAGE}"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25"
            - name: AWS_REGION
              value: "us-east-1"
            - name: ORCHESTRATOR_TABLE_NAME
              value: "pitflow-orchestrator"
            - name: ORCHESTRATOR_QUEUE_NAME
              value: "service-order-orchestrator-queue"
            - name: PAYMENT_COMMAND_QUEUE_NAME
              value: "payment-command-queue"
            - name: OPERATION_COMMAND_QUEUE_NAME
              value: "operation-command-queue"
          startupProbe:
            httpGet:
              path: /orchestrator/actuator/health
              port: 8080
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /orchestrator/actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /orchestrator/actuator/health
              port: 8080
            periodSeconds: 15
